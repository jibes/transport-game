plugins {
    id 'com.android.application'
}

// SDL3 source tree; its Java glue (org.libsdl.app) must match the native libSDL3.so version.
def sdlSrc = project.findProperty('sdlSrc') ?: "${rootDir}/../../build-android-deps/SDL"

android {
    namespace 'org.openttd.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'org.openttd.mobile'
        minSdk 26
        targetSdk 35
        // CI run number -> monotonically increasing version, so Obtainium sees updates.
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int
        versionCode build
        // Zero-padded so release tags sort correctly as plain text (GitHub/Obtainium ordering).
        versionName String.format('0.2.%04d', build)
    }

    // Committed dev key: stable signature across CI runners so updates install over each other.
    // Not a release key; replace with a secret-backed key before store distribution.
    signingConfigs {
        debug {
            storeFile file("${rootDir}/ci-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${sdlSrc}/android-project/app/src/main/java"]
            // Prebuilt native libs + game data are staged by os/android/stage.sh.
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Data files are already compressed (grf/tar) or tiny; keep them uncompressed for fast extraction.
    androidResources {
        noCompress += ['grf', 'tar', 'obg', 'obs', 'obm', 'lng', 'nut']
    }
}
