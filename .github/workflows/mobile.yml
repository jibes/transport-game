name: Mobile (Android + Web)

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.3'

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: build-android-deps
        key: android-deps-${{ hashFiles('os/android/build.sh') }}

    - name: Build APK
      run: |
        export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        os/android/build.sh arm64-v8a

    - uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: os/android/app/build/outputs/apk/debug/*.apk

  web:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.1
    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cp os/emscripten/ports/liblzma.py /emsdk/upstream/emscripten/tools/ports/contrib/
        cmake -S . -B build-host -DOPTION_TOOLS_ONLY=ON
        cmake --build build-host -j "$(nproc)" --target tools
        emcmake cmake -S . -B build-web -DHOST_BINARY_DIR="$PWD/build-host" -DCMAKE_BUILD_TYPE=Release -DOPTION_USE_ASSERTS=OFF
        # Bundle OpenGFX so the game starts offline (no runtime BaNaNaS download).
        mkdir -p build-web/baseset
        python3 -c "import urllib.request as u; u.urlretrieve('https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip', 'opengfx.zip')"
        python3 -m zipfile -e opengfx.zip build-web/baseset/
        cmake --build build-web -j "$(nproc)" --target openttd

    - uses: actions/upload-artifact@v4
      with:
        name: web
        path: |
          build-web/openttd.html
          build-web/openttd.js
          build-web/openttd.wasm
          build-web/openttd.data
