name: Mobile (Android + Web)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.3'

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: build-android-deps
        key: android-deps-${{ hashFiles('os/android/build.sh') }}

    - name: Build APK
      run: |
        export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        os/android/build.sh arm64-v8a x86_64

    - uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: os/android/app/build/outputs/apk/debug/*.apk

    # One pre-release per build; Obtainium tracks these (enable "Include prereleases").
    - name: Publish pre-release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        V="0.1.${GITHUB_RUN_NUMBER}"
        APK="transport-mobile-${V}-arm64-v8a.apk"
        cp os/android/app/build/outputs/apk/debug/*.apk "$APK"
        gh release create "android-v${V}" "$APK" --prerelease --target "$GITHUB_SHA" \
          --title "Android ${V}" --notes "Dev build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Debug-signed, arm64 only."

  # Install + launch on an x86_64 emulator; dump logcat and a screenshot.
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: apk

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: |
          adb install -r apk/*.apk
          adb logcat -c
          adb shell am start -W -n org.openttd.mobile/.MainActivity
          sleep 45
          adb shell pidof org.openttd.mobile && echo "SMOKE: process alive" || echo "SMOKE: process DEAD"
          adb exec-out screencap -p > screen.png
          adb logcat -d > logcat.txt
          echo "----- logcat (filtered) -----"
          grep -E "openttd|SDL|TransportMobile|AndroidRuntime|DEBUG|libc|FATAL|crash" logcat.txt | tail -n 300 || true

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-smoke
        path: |
          logcat.txt
          screen.png

  web:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.1
    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cp os/emscripten/ports/liblzma.py /emsdk/upstream/emscripten/tools/ports/contrib/
        cmake -S . -B build-host -DOPTION_TOOLS_ONLY=ON
        cmake --build build-host -j "$(nproc)" --target tools
        emcmake cmake -S . -B build-web -DHOST_BINARY_DIR="$PWD/build-host" -DCMAKE_BUILD_TYPE=Release -DOPTION_USE_ASSERTS=OFF
        # Bundle OpenGFX so the game starts offline (no runtime BaNaNaS download).
        mkdir -p build-web/baseset
        curl -fsSL -o opengfx.zip https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip
        python3 -m zipfile -e opengfx.zip build-web/baseset/
        cmake --build build-web -j "$(nproc)" --target openttd

    - name: Stage site
      run: |
        mkdir -p site
        cp build-web/openttd.html site/index.html
        cp build-web/openttd.js build-web/openttd.wasm build-web/openttd.data site/

    - uses: actions/upload-artifact@v4
      with:
        name: web
        path: site

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  # Publishing (Pages + pre-releases) only from main; other branches/PRs just build.
  pages:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - id: deploy
      uses: actions/deploy-pages@v4
